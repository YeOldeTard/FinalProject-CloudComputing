<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Form</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="background_color">
  <!-- Alert  ERROR-->
  <div class="alertContainerError">
    <div id="alertError" class="alert alert-danger d-none" role="alert">
      Password Salah!
      <img src="https://img.icons8.com/ios-filled/50/error--v1.png" height="30" width="30" > 
    </div>
  </div>
  <!-- Alert  Success-->
  <div>
    <div class="alertContainerSuccess">
      <div id="alertSuccess" class="alert alert-success d-none" role="alert">
        Login Sukses!
        <img src="https://img.icons8.com/ios/50/ok--v1.png" height="30" width="30" > 
      </div>
    </div>
  </div>
  <div class="centered_elements">
    <div class="mica-effect">
      <p class="change_font">Please Login </p>
      <div class="mb-3">
        <input type="text" class="form-control" id="inputUsername" aria-describedby="usernameHelp" placeholder="Username" style="text-align: center;">
      </div>
      <div class="mb-3">
        <input type="password" class="form-control" id="inputPassword", placeholder="Password" style="text-align: center;">
      </div>
      <button type="submit" class="btn btn-primary" onclick="loginCheck()">Login</button>
    </div>
  </div>
  <script src="index.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
